aid: harbinger
name: Harbinger
description: >-
  Harbinger (Harbinger Motors Inc.) is an American commercial-vehicle manufacturer founded in July
  2021 and headquartered in Garden Grove, California. It builds a purpose-designed medium-duty
  platform — Class 4-6 stripped chassis in all-electric and plug-in hybrid range-extended
  configurations, the HC Series low-cab-forward cab chassis, the Sevna cab chassis and a step van —
  around in-house motors, battery packs, power electronics and vehicle software, and sells into
  last-mile delivery, work-truck, mobile-healthcare, RV and motorhome, and government fleets. Its
  Harbinger Industria line packages the same drivetrain as off-grid and jobsite power systems. The
  company has announced serial production of an American-made medium-duty EV, a $160 million Series
  C co-led by FedEx, Capricorn and THOR Industries, the acquisition of autonomous-driving company
  Phantom AI alongside a ZF licensing agreement, and a robotics partnership with American
  Rheinmetall. Harbinger is a vehicle manufacturer rather than a software vendor, and publishes no
  developer program, no developer portal, no API documentation, no SDKs and no partner API. The
  only machine-readable interface it exposes to the public is the WordPress REST content API behind
  harbingermotors.com, which is captured here for discovery purposes and is anonymously readable
  but read-only.
