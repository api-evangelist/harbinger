link_relations:
  detail: >-
    Every record carries a `_links` object of HAL-style relations, and `_embed=1` inlines the
    resolvable ones under `_embedded`. This is the intended traversal mechanism and it is the only
    way to read an author on this host.
  relations: [self, collection, about, author, replies, 'wp:featuredmedia', 'wp:attachment', 'wp:term', curies]
gaps:
  - >-
    No structured event data. The `event` post type exposes `acf: []` — the trade-show date, venue
    and city that a fleet buyer would want are inside rendered HTML, not fields. This is the single
    biggest machine-readability gap on the surface and it is one line of PHP for Harbinger to fix
    (`show_in_rest` on the field group).
  - >-
    No structured product data. The chassis, cab and step-van specifications live in page content
    and in PDF spec sheets under /wp/v2/media, not as a product entity. There is no Vehicle,
    Chassis or SpecSheet type registered.
  - >-
    Authors are unresolvable anonymously, so a post's byline can only be reached through _embed.
