description: >-
  The operational-transparency posture of the harbingermotors.com content API. Harbinger Motors
  publishes no versioning policy, no deprecation policy, no SLA, no API status page and no API
  changelog, because it publishes no developer program. Every negative below was checked, not
  assumed.
