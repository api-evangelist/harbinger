  current: wp/v2
  docs: null
  detail: >-
    The version is inherited from WordPress core, not chosen by Harbinger. It moves when the site
    is upgraded, with no announcement. 14 namespaces registered at capture; a plugin removal
    silently removes a namespace and everything under it — the yoast/v1 and oembed/1.0 surfaces
    documented in this repo exist only for as long as those plugins stay installed.
