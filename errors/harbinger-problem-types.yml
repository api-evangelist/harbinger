envelope:
  shape: '{code, message, data: {status, params?, details?}}'
  content_type: application/json; charset=UTF-8
  matching_rule: >-
    Match on `code`. It is the stable machine-readable identifier. `message` is a localized human
    string and changes with the WordPress version and site locale; `data.status` repeats the HTTP
    status in the body.
  problem_json: false
  note: >-
    This surface does not emit application/problem+json and declares no `type` URIs. There is no
    published error reference for it either, because Harbinger Motors publishes no API
    documentation — every entry below was produced by making the failing request.
problems:
- code: rest_invalid_param
  status: 400
  title: Invalid parameter
  detail: One or more query parameters failed validation. `data.params` maps each offending parameter to a message and `data.details` carries a structured per-parameter code.
  remediation: Read `data.params` and correct the named parameter. per_page is bounded to 1..100; orderby is an enum declared per route in the OPTIONS document.
  observed_at: 'https://harbingermotors.com/wp-json/wp/v2/posts?per_page=999'
  observed_message: 'Invalid parameter(s): per_page'
  source_operation: openapi/harbinger-posts-api-openapi.yml#listPosts
- code: rest_missing_callback_param
  status: 400
  title: Missing required parameter
  detail: A required query parameter was omitted. `data.params` is an array of the missing names.
  remediation: Supply the named parameter. The Yoast get_head endpoint requires `url`.
  observed_at: https://harbingermotors.com/wp-json/yoast/v1/get_head
  observed_message: 'Missing parameter(s): url'
  source_operation: openapi/harbinger-seo-api-openapi.yml#getSeoHead
